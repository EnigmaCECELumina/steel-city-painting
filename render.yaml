services:
  # Static Web Site Service (Free Tier)
  - type: web
    name: steel-city-painting
    env: static
    buildCommand: npm run build
    staticPublishPath: ./out
    autoDeploy: true
    routes:
      # Rewrite all dynamic routes to index.html for SPA support if needed
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Cache static assets for fast global delivery
      - path: /_next/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

    envVars:
      - key: NODE_VERSION
        value: 20.x
